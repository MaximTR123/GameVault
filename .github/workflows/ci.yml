name: GameVault CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run tests and generate reports
        run: mvn --batch-mode clean verify

      - name: Coverage summary
        if: always()
        run: python3 .github/scripts/coverage_summary.py >> "$GITHUB_STEP_SUMMARY"

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          path: target/site/jacoco
          retention-days: 14

      - name: Upload test and quality reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-and-quality-reports
          path: |
            target/surefire-reports
            target/checkstyle-result.xml
            target/spotbugsXml.xml
          retention-days: 14

      - name: Build Docker image
        run: docker build -t gamevault-server .