spring.application.name=gamevault-server

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/gamevault}
spring.datasource.username=${DB_USERNAME:gamevault_user}
spring.datasource.password=${DB_PASSWORD}

app.jwt.secret=${JWT_SECRET}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

app.bootstrap.admin.username=${ADMIN_USERNAME:admin}
app.bootstrap.admin.email=${ADMIN_EMAIL:admin@example.com}
app.bootstrap.admin.password=${ADMIN_PASSWORD:}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:1420,http://localhost:5173,http://tauri.localhost,tauri://localhost}
